<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A terminal-style Ollama chat client for GitHub Pages.">
  <title>ollama://terminal</title>
  <style>
    :root { color-scheme: dark; --bg:#080b0d; --panel:#0d1215; --panel-2:#11191d; --line:#243239; --text:#d6e4e3; --muted:#74878a; --green:#8be28a; --cyan:#72d8e5; --amber:#f0c674; --red:#ff7b7b; --shadow:rgba(0,0,0,.45); }
    * { box-sizing:border-box; } html,body { min-height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px); background-size:100% 4px; opacity:.3; }
    button,input { font:inherit; } button { cursor:pointer; }
    .shell { width:min(1180px,100%); margin:0 auto; padding:28px 18px 20px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; border:1px solid var(--line); border-bottom:0; padding:10px 14px; background:var(--panel); box-shadow:0 12px 32px var(--shadow); }
    .window-controls { display:flex; gap:6px; margin-right:12px; } .window-controls i { width:9px; height:9px; border-radius:50%; background:var(--line); } .window-controls i:first-child { background:#ff6b6b; } .window-controls i:nth-child(2) { background:#f0c674; } .window-controls i:last-child { background:#8be28a; }
    .titlebar { display:flex; align-items:center; }
    .brand { color:var(--green); letter-spacing:.08em; } .brand span { color:var(--muted); }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; } .dot { width:8px; height:8px; border-radius:50%; background:var(--amber); box-shadow:0 0 12px currentColor; } .dot.ready { background:var(--green); } .dot.error { background:var(--red); }
    .terminal { min-height:min(720px,calc(100vh - 150px)); display:flex; flex-direction:column; border:1px solid var(--line); background:var(--panel); box-shadow:0 24px 70px var(--shadow); }
    .screen { flex:1; overflow-y:auto; padding:22px clamp(14px,4vw,42px); } .line { margin:0 0 11px; white-space:pre-wrap; overflow-wrap:anywhere; animation:line-in .24s ease-out both; } .prompt { color:var(--green); } .muted { color:var(--muted); } .cyan { color:var(--cyan); } .amber { color:var(--amber); } .error { color:var(--red); } .green { color:var(--green); }
    .welcome { margin:12px 0 28px; color:var(--muted); animation:boot-in .8s ease-out both; } .welcome strong { display:block; margin-bottom:4px; color:var(--green); font-size:18px; font-weight:500; text-shadow:0 0 18px rgba(139,226,138,.25); }
    .welcome::after { content:"_"; color:var(--green); animation:blink 1s steps(2,end) infinite; }
    .command-row { display:flex; gap:10px; align-items:flex-start; } .command-row .prompt { flex:none; padding-top:11px; }
    #command-input { width:100%; min-width:0; border:0; outline:0; padding:10px 0; color:var(--text); background:transparent; caret-color:var(--green); } #command-input:focus { text-shadow:0 0 9px rgba(214,228,227,.35); } #command-input::placeholder { color:#4c5e61; }
    .hint { border-top:1px solid var(--line); padding:9px 14px; color:var(--muted); font-size:12px; }
    .settings { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0 26px; } .setting { border:1px solid var(--line); padding:12px; background:var(--panel-2); min-width:0; animation:line-in .35s .12s ease-out both; } .setting label { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; } .setting value { display:block; color:var(--cyan); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .model-table { width:100%; border-collapse:collapse; margin:7px 0 20px; } .model-table th,.model-table td { text-align:left; border-bottom:1px solid var(--line); padding:8px 10px 8px 0; } .model-table th { color:var(--muted); font-weight:normal; font-size:12px; } .model-table td:first-child { color:var(--cyan); } .model-table tr.selected td:first-child { color:var(--green); } .model-table tr.selected td:first-child::before { content:"> "; } .action { border:1px solid var(--line); color:var(--cyan); background:transparent; padding:4px 8px; } .action:hover { border-color:var(--cyan); color:var(--text); }
    @keyframes line-in { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } } @keyframes boot-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } } @keyframes blink { 50% { opacity:0; } } @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
    @media (max-width:700px) { .shell { padding:10px 8px; } .topbar { align-items:flex-start; flex-direction:column; gap:4px; } .settings { grid-template-columns:1fr; } .terminal { min-height:calc(100vh - 105px); } .screen { padding:18px 12px; } .hint { line-height:1.8; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="titlebar"><div class="window-controls" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand">ollama<span>://</span>terminal</div></div><div class="status"><i class="dot" id="status-dot"></i><span id="status-text">cloud api ready</span></div></header>
    <section class="terminal" aria-label="Ollama terminal chat">
      <div class="screen" id="screen" role="log" aria-live="polite"><div class="welcome"><strong>Ollama Cloud // GitHub Pages</strong>Native API online at <span class="cyan">https://ollama.com/api</span>. Type <span class="cyan">help</span> for commands.</div><div class="settings" id="settings"></div></div>
      <form class="command-row" id="command-form"><span class="prompt">guest@ollama:~$</span><input id="command-input" autocomplete="off" autofocus placeholder="type a message or command..." aria-label="Command or message"></form>
      <div class="hint">up/down history &nbsp;|&nbsp; <span class="cyan">help</span> commands &nbsp;|&nbsp; <span class="cyan">list</span> models</div>
    </section>
  </main>
  <script>
    (function () {
      'use strict';

      var apiBase = 'https://ollama-pages-proxy.iboxone94.workers.dev';
      var storageKey = 'ollama-terminal-settings';
      var screen = document.getElementById('screen');
      var input = document.getElementById('command-input');
      var form = document.getElementById('command-form');
      var statusDot = document.getElementById('status-dot');
      var statusText = document.getElementById('status-text');
      var settingsBox = document.getElementById('settings');
      var state = { key: '', model: '', models: [], messages: [], history: [], historyIndex: -1, busy: false };

      try { Object.assign(state, JSON.parse(localStorage.getItem(storageKey) || '{}')); } catch (ignore) {}

      function save() {
        try { localStorage.setItem(storageKey, JSON.stringify({ key: state.key, model: state.model })); } catch (ignore) {}
      }

      function print(text, className) {
        var item = document.createElement('div');
        item.className = 'line ' + (className || 'output');
        item.textContent = text;
        screen.appendChild(item);
        screen.scrollTop = screen.scrollHeight;
        return item;
      }

      function setStatus(text, type) {
        statusText.textContent = text;
        statusDot.className = 'dot ' + (type || '');
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char];
        });
      }

      function renderSettings() {
        var masked = state.key ? state.key.slice(0, 4) + '****' : 'managed by proxy';
        settingsBox.innerHTML = '<div class="setting"><label>service</label><value>ollama cloud /api</value></div>' +
          '<div class="setting"><label>model</label><value>' + escapeHtml(state.model || 'choose with list') + '</value></div>' +
          '<div class="setting"><label>auth</label><value>' + escapeHtml(masked) + '</value></div>';
      }

      function request(path, options) {
        var settings = options || {};
        var headers = settings.headers || {};
        var controller = window.AbortController ? new AbortController() : null;
        var timer = controller ? window.setTimeout(function () { controller.abort(); }, 20000) : null;
        if (state.key) headers.Authorization = 'Bearer ' + state.key;
        if (settings.body) headers['Content-Type'] = 'application/json';
        var fetchOptions = { method: settings.method || 'GET', headers: headers, cache: 'no-store' };
        if (settings.body) fetchOptions.body = settings.body;
        if (controller) fetchOptions.signal = controller.signal;
        return fetch(apiBase + path, fetchOptions).then(function (response) {
          if (timer) window.clearTimeout(timer);
          if (!response.ok) {
            return response.text().then(function (body) {
              var detail = body;
              try { detail = JSON.parse(body).error || body; } catch (ignore) {}
              throw new Error('HTTP ' + response.status + ': ' + detail);
            });
          }
          return response;
        }).catch(function (error) {
          if (timer) window.clearTimeout(timer);
          if (error.name === 'AbortError') throw new Error('request timed out after 20 seconds');
          if (error instanceof TypeError) throw new Error('Safari blocked the proxy request. Open the GitHub Pages URL, not a local file or localhost.');
          throw error;
        });
      }

      function listModels() {
        print('querying ' + apiBase + '/tags ...', 'muted');
        setStatus('scanning models');
        request('/tags').then(function (response) { return response.json(); }).then(function (data) {
          state.models = data.models || [];
          setStatus(state.models.length + ' models detected', 'ready');
          if (!state.models.length) { print('proxy connected, but no models were returned', 'amber'); return; }
          var table = document.createElement('table');
          table.className = 'model-table';
          table.innerHTML = '<thead><tr><th>model</th><th>size</th><th>modified</th><th></th></tr></thead><tbody></tbody>';
          state.models.forEach(function (model) {
            var name = model.name || model.model || 'unknown';
            var row = document.createElement('tr');
            if (name === state.model) row.className = 'selected';
            row.innerHTML = '<td>' + escapeHtml(name) + '</td><td>' + (model.size ? (model.size / 1073741824).toFixed(1) + ' GB' : '-') + '</td><td>' + (model.modified_at ? new Date(model.modified_at).toLocaleDateString() : '-') + '</td><td><button class="action" data-model="' + escapeHtml(name) + '">use</button></td>';
            table.querySelector('tbody').appendChild(row);
          });
          screen.appendChild(table);
          table.addEventListener('click', function (event) {
            var button = event.target.closest('[data-model]');
            if (!button) return;
            state.model = button.getAttribute('data-model');
            save(); renderSettings(); print('model set to ' + state.model, 'green');
          });
        }).catch(function (error) {
          setStatus('request failed', 'error');
          print('error: ' + error.message, 'error');
        });
      }

      function chat(message) {
        if (!state.model) { print('select a model first with: list, then use <model>', 'amber'); return Promise.resolve(); }
        state.messages.push({ role: 'user', content: message });
        setStatus('chatting with ' + state.model, 'ready');
        return request('/chat', { method: 'POST', body: JSON.stringify({ model: state.model, messages: state.messages, stream: false }) }).then(function (response) {
          return response.json();
        }).then(function (data) {
          var answer = data.message && data.message.content ? data.message.content : data.response || '';
          state.messages.push({ role: 'assistant', content: answer });
          print(answer, 'output');
          setStatus('cloud api ready', 'ready');
        }).catch(function (error) {
          state.messages.pop();
          throw error;
        });
      }

      function utility(path, payload) {
        setStatus(path.slice(1), 'ready');
        return request(path, { method: 'POST', body: JSON.stringify(payload) }).then(function (response) {
          return response.json();
        }).then(function (data) {
          print(JSON.stringify(data, null, 2), 'output');
          setStatus('cloud api ready', 'ready');
        });
      }

      function help() {
        print('commands:', 'cyan');
        print('  list / models       fetch available models');
        print('  use <model>         select a model');
        print('  chat <message>      send a chat message');
        print('  set key <key>       optional browser key; proxy key is preferred');
        print('  set model <name>    select a model');
        print('  new                 clear chat memory');
        print('  settings / clear / reset');
      }

      function run(command) {
        var trimmed = command.trim();
        if (!trimmed) return;
        print('guest@ollama:~$ ' + trimmed, 'prompt');
        var parts = trimmed.split(/\s+/), verb = parts[0].toLowerCase(), value = trimmed.slice(parts[0].length).trim();
        if (verb === 'help' || verb === '?') return help();
        if (verb === 'list' || verb === 'models') return listModels();
        if (verb === 'settings') { renderSettings(); return print('proxy: ' + apiBase + '\nmodel: ' + (state.model || 'none'), 'output'); }
        if (verb === 'clear') { screen.innerHTML = '<div class="settings" id="settings"></div>'; settingsBox = document.getElementById('settings'); renderSettings(); return; }
        if (verb === 'new' || verb === 'reset') { state.messages = []; if (verb === 'reset') { state.key = ''; state.model = ''; save(); renderSettings(); } return print('chat context cleared', 'cyan'); }
        if (verb === 'use' && value) { state.model = value; save(); renderSettings(); return print('model set to ' + value, 'cyan'); }
        if (verb === 'set' && parts.length > 2) { if (parts[1] === 'key') state.key = parts.slice(2).join(' '); else if (parts[1] === 'model') state.model = parts.slice(2).join(' '); else return print('endpoint is fixed to the Ollama Cloud proxy', 'error'); save(); renderSettings(); return print(parts[1] + ' updated', 'cyan'); }
        if (state.busy) return print('please wait for the current request', 'amber');
        state.busy = true;
        var action;
        if (verb === 'embed') action = utility('/embed', { model: state.model, input: value });
        else if (verb === 'web_search') action = utility('/web_search', { query: value });
        else if (verb === 'web_fetch') action = utility('/web_fetch', { url: value });
        else action = chat(verb === 'chat' ? value : trimmed);
        return action.catch(function (error) {
          setStatus('request failed', 'error');
          print('error: ' + error.message, 'error');
        }).then(function () { state.busy = false; });
      }

      form.addEventListener('submit', function (event) { event.preventDefault(); var value = input.value; input.value = ''; run(value); });
      input.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowUp' && state.history.length) { event.preventDefault(); state.historyIndex = Math.min(state.historyIndex + 1, state.history.length - 1); input.value = state.history[state.historyIndex]; }
        if (event.key === 'ArrowDown' && state.historyIndex >= 0) { event.preventDefault(); state.historyIndex -= 1; input.value = state.historyIndex < 0 ? '' : state.history[state.historyIndex]; }
      });
      renderSettings();
    }());
  </script>
</body>
</html>
